[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "normguard"
version = "0.1.0"
description = "Evidence-led assurance for text-normalisation changes in retrieval systems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "NormGuard contributors" }
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/normguard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
