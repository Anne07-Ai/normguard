[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "normguard"
version = "0.1.0"
description = "Policy-first safety controls and evidence for text normalisation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "NormGuard contributors" }
]
keywords = ["ai-safety", "normalisation", "nlp", "rag", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Anne07-Ai/normguard"
Issues = "https://github.com/Anne07-Ai/normguard/issues"
Repository = "https://github.com/Anne07-Ai/normguard"
dependencies = [
  "bm25s==0.3.11",
  "cryptography>=46,<51",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
  "ir-measures==0.4.3",
  "numpy>=2.0,<3",
  "spacy==3.8.16",
]

[project.scripts]
normguard = "normguard.cli:main"

[project.optional-dependencies]
esci = ["pyarrow>=18,<22"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/normguard"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
